<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- Border & Background -->
  <rect x="10" y="10" width="580" height="380" rx="16" fill="url(#certBg)" stroke="url(#borderGrad)" stroke-width="2" />
  <rect x="25" y="25" width="550" height="350" rx="10" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="8 6" />

  <!-- Badge Icon -->
  <circle cx="300" cy="110" r="42" fill="#111827" stroke="url(#goldGrad)" stroke-width="2.5" />
  <path d="M300 85 L307 102 L325 103 L311 114 L316 131 L300 120 L284 131 L289 114 L275 103 L293 102 Z" fill="url(#goldGrad)" />
  <path d="M285 145 L275 175 L292 165 L300 178 L308 165 L325 175 L315 145" fill="none" stroke="url(#goldGrad)" stroke-width="2" />

  <!-- Certificate Heading -->
  <text x="300" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="2">
    CERTIFICATE OF COMPLETION
  </text>
  <text x="300" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#94a3b8" text-anchor="middle">
    VERIFIED TECHNICAL CREDENTIAL
  </text>

  <!-- Divider Line -->
  <line x1="200" y1="245" x2="400" y2="245" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Recipient / Candidate -->
  <text x="300" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#38bdf8" text-anchor="middle">
    AWARDED TO ELUMALAI M
  </text>

  <text x="300" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">
    Rajalakshmi Institute of Technology • Anna University
  </text>

  <!-- Security Seal / Serial Badge -->
  <g transform="translate(470, 310)">
    <circle cx="25" cy="25" r="22" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="25" y="29" font-family="monospace" font-size="8" fill="#38bdf8" text-anchor="middle">VERIFIED</text>
  </g>
  <g transform="translate(65, 320)">
    <text x="0" y="15" font-family="monospace" font-size="11" fill="#475569">AUTH ID: NPTEL/TECH/ELUMALAI-M</text>
  </g>
</svg>

