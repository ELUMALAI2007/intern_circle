<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0a0d14" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" rx="40" fill="url(#bgGrad)" />

  <!-- Cyber Grid Pattern Elements -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="500" />
    <line x1="150" y1="0" x2="150" y2="500" />
    <line x1="250" y1="0" x2="250" y2="500" />
    <line x1="350" y1="0" x2="350" y2="500" />
    <line x1="450" y1="0" x2="450" y2="500" />
    <line x1="0" y1="50" x2="500" y2="500" />
    <line x1="0" y1="150" x2="500" y2="150" />
    <line x1="0" y1="250" x2="500" y2="250" />
    <line x1="0" y1="350" x2="500" y2="350" />
    <line x1="0" y1="450" x2="500" y2="450" />
  </g>

  <!-- Glowing Outer Aura Ring -->
  <circle cx="250" cy="230" r="150" fill="none" stroke="url(#ringGrad)" stroke-width="3" stroke-dasharray="10 15" filter="url(#glow)" opacity="0.8" />
  <circle cx="250" cy="230" r="135" fill="#111827" stroke="rgba(255,255,255,0.1)" stroke-width="2" />

  <!-- Abstract Developer/AI Tech Avatar -->
  <!-- Head & Shoulders Silhouette with Tech Gradients -->
  <g fill="url(#accentGrad)" opacity="0.95">
    <!-- Stylized Head -->
    <circle cx="250" cy="180" r="50" />
    <!-- Stylized Shoulders / Body -->
    <path d="M160 330 C160 260, 200 245, 250 245 C300 245, 340 260, 340 330 Z" />
  </g>

  <!-- Tech Nodes & Constellations (Representing AI & Data Science) -->
  <g stroke="#38bdf8" stroke-width="2" fill="#38bdf8">
    <circle cx="160" cy="140" r="4" />
    <line x1="160" y1="140" x2="210" y2="160" stroke="rgba(56, 189, 248, 0.4)" />
    
    <circle cx="340" cy="140" r="4" />
    <line x1="340" y1="140" x2="290" y2="160" stroke="rgba(56, 189, 248, 0.4)" />

    <circle cx="130" cy="220" r="4" />
    <line x1="130" y1="220" x2="180" y2="250" stroke="rgba(56, 189, 248, 0.4)" />

    <circle cx="370" cy="220" r="4" />
    <line x1="370" y1="220" x2="320" y2="250" stroke="rgba(56, 189, 248, 0.4)" />
  </g>

  <!-- Central Monogram Badge -->
  <circle cx="250" cy="245" r="30" fill="#0b0f19" stroke="url(#ringGrad)" stroke-width="2.5" />
  <text x="250" y="253" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="1">EM</text>

  <!-- Bottom Tag Pill -->
  <rect x="110" y="410" width="280" height="42" rx="21" fill="#0f172a" stroke="url(#ringGrad)" stroke-width="1.5" />
  <text x="250" y="437" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle" letter-spacing="0.5">
    AI &amp; DATA SCIENCE STUDENT
  </text>
</svg>
